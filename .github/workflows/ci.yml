name: CI

# Pull-request gate. Pushes to main are validated (and released) by release.yml,
# which runs the same typecheck + test + build before publishing — so we don't
# duplicate the run here.
on:
  pull_request:

# Run JavaScript actions on the Node 24 runtime (opt-in until GitHub defaults to it).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
