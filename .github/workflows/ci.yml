name: CI

# Runs on PRs and on pushes to main. (release.yml also gates main before
# publishing; the release bot's changelog commit carries [skip ci], so it
# doesn't re-trigger this.)
on:
  pull_request:
  push:
    branches: [main]

# Run JavaScript actions on the Node 24 runtime (opt-in until GitHub defaults to it).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
