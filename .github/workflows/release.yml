name: Release

# semantic-release: on every push to main, analyze Conventional Commits, compute
# the next version, tag it, write the changelog, cut a GitHub release, then build
# and push the multi-arch image to GHCR with the matching semver tags.
# No manual tagging. (The changelog commit it makes carries [skip ci].)
on:
  push:
    branches: [main]

permissions:
  contents: write # tags, release, changelog commit
  issues: write
  pull-requests: write
  packages: write # push to GHCR

concurrency:
  group: release
  cancel-in-progress: false

# Run JavaScript actions on the Node 24 runtime (opt-in until GitHub defaults to it).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so semantic-release sees tags/commits

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            conventional-changelog-conventionalcommits
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Build & publish the image only when a release was actually cut ──
      - if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/setup-qemu-action@v3
      - if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/beliwin/listo:latest
            ghcr.io/beliwin/listo:${{ steps.semantic.outputs.new_release_version }}
            ghcr.io/beliwin/listo:${{ steps.semantic.outputs.new_release_major_version }}.${{ steps.semantic.outputs.new_release_minor_version }}
            ghcr.io/beliwin/listo:${{ steps.semantic.outputs.new_release_major_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
